plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.3'
}

version = project.mod_version
group = project.maven_group
base.archivesName = 'TheHammerMod'

repositories {
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { url = 'https://maven.shedaniel.me/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // Optional at runtime: only the config screen needs them
    compileOnly "maven.modrinth:modmenu:${modmenu_version}"
    compileOnly("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") { exclude group: 'net.fabricmc.fabric-api' }
}

processResources {
    inputs.property 'version', version
    filesMatching('fabric.mod.json') { expand 'version': version }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.compilerArgs += ['-Xmaxerrs', '10000']
}
